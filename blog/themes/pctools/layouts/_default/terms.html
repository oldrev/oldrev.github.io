{{ define "main" }}
<div class="dos-title-bar">
  {{ .Title }}
</div>

<div class="terms-content">
  {{ .Content }}
  
  {{ if .Data.Terms }}
  <ul class="terms-list" style="list-style: none; margin: 0; padding: 0;">
    {{ range .Data.Terms.Alphabetical }}
    <li style="border: 1px solid #55FFFF; margin-bottom: 10px; padding: 10px;">
      <a href="{{ .Page.RelPermalink }}" style="font-size: 22px;">
        [{{ .Page.Title }}]
      </a>
      <span style="color: #AAAAAA; margin-left: 10px;">({{ .Count }})</span>
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
