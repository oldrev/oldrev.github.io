<div class="dos-status-bar">
  <div class="status-left">
    <span class="key-shortcut">F1</span> {{ i18n "help" | default "Help" }}
    <span style="margin-left: 15px;"><span class="key-shortcut">F10</span> {{ i18n "menu" | default "Menu" }}</span>
    <span style="margin-left: 15px;"><span class="key-shortcut">ESC</span> {{ i18n "exit" | default "Exit" }}</span>
  </div>
  <div class="status-right">
    <span id="current-time"></span>
    <span class="cursor"></span>
  </div>
</div>
